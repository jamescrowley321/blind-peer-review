# Blind Peer Review — a fresh-context, diff-only AI review gate.
#
# One composite action, two modes:
#   mode: lens  — run ONE adversarial persona as a fresh agent session. The
#                 agent emits findings as JSON (its final message); the action
#                 parses it, renders the `## <Lens>` review body, and posts the
#                 PR review DETERMINISTICALLY via Octokit (the agent never calls
#                 the GitHub write API). No automatic retry — a flaky/empty model
#                 output fails THIS lens job so a human re-runs it.
#   mode: gate  — aggregate the lens reviews on the head commit and fail closed
#                 (blocking merge) if any lens requested changes or is missing.
#
# The caller runs `mode: lens` as a matrix (one job per lens, in parallel) and a
# final `mode: gate` job that `needs:` them. See examples/caller-workflow.yml.
#
# Engine: the pi coding agent (pi.dev) via shaftoe/pi-coding-agent-action,
# routed through OpenRouter; default model google/gemini-2.5-pro (strong JSON adherence, stable slug). All overridable.

name: 'Blind Peer Review'
description: 'Fresh-context, diff-only adversarial PR review — five skeptical AI lenses that fail the merge on real defects.'
author: 'James Crowley'

branding:
  icon: 'shield'
  color: 'purple'

outputs:
  matrix:
    description: "mode=config: {\"include\":[{lens,name,model}]} for the caller's review job `strategy.matrix`, and for this action's `lenses` input in mode=gate."
    value: ${{ steps.lens_matrix.outputs.matrix }}

inputs:
  mode:
    description: "'config' to resolve the lens matrix, 'lens' to run a single review persona, 'gate' to aggregate and adjudicate, or 'preflight' to wait on prerequisite checks."
    required: true
  enabled:
    description: |
      mode=config: the lens keys to run, ONE PER LINE, `#` comments allowed.
      Unknown or repeated keys fail the job rather than being skipped: a lens the
      caller believes is running but is not is the failure this input exists to
      prevent. Display names come from lenses/manifest.json, so callers never
      carry a copy of the registry.
    required: false
    default: ''
  lens_models:
    description: |
      mode=config: optional per-lens model, `<lens> = <model>` ONE PER LINE.
      Lenses are not the same kind of work — a policy lens checking a checkbox
      does not need the model a red-team lens needs — and the review job's matrix
      already carries a model per entry, so each lens can run on its own. Any lens
      with no line here falls back to `default_model`. An unknown lens key fails
      the job; ignoring it would leave that lens on the default while the config
      claims otherwise.
    required: false
    default: ''
  default_model:
    description: "mode=config: model for any enabled lens with no `lens_models` line. Empty means the action's own default."
    required: false
    default: '' 
  lens:
    description: "Which persona to run when mode=lens: cold_read | edge_case | acceptance | security | red_team."
    required: false
    default: ''
  lenses:
    description: |
      mode=gate: the lens set the gate must see report, as JSON. Pass the SAME
      value that built the caller matrix — the config job's matrix output — so
      the two cannot drift. See examples/caller-workflow.yml for the exact line;
      it is not written here because a templated expression anywhere in an input
      description is evaluated when the action loads, and the action then fails
      to load at all.
      Accepts the matrix object {"include":[{"lens":"cold_read",...}]} or a plain
      array ["cold_read","edge_case"]. Never a delimited string: an Actions input
      is always a string, so the only question is which parser reads it, and JSON
      is the one that cannot be broken by a character inside a value.
    required: false
    default: '["cold_read","edge_case","acceptance","security","red_team"]'
  api_key:
    description: "Provider API key (e.g. OpenRouter). Required for mode=lens. Pass from a secret."
    required: false
    default: ''
  github_token:
    description: "A GITHUB_TOKEN (or PAT) with pull-requests write access. Pass the workflow's GITHUB_TOKEN secret."
    required: true
  provider:
    description: "pi provider backend."
    required: false
    default: 'openrouter'
  model:
    description: "Model id for the provider. Default is google/gemini-2.5-pro — strong instruction/JSON adherence and a stable OpenRouter slug. NOTE: pin models that pi's catalog AND OpenRouter both serve: OpenRouter retired the undated anthropic/claude-sonnet-5 alias (chat/completions 404s) while pi's catalog lacks the dated snapshot, so no Anthropic Sonnet-5 slug currently resolves through openrouter+pi. Override to any model; pair with models_config to enforce routing floors."
    required: false
    default: 'google/gemini-2.5-pro'
  models_config:
    description: |
      Optional JSON for pi's `~/.pi/agent/models.json`, written before the lens runs
      (mode=lens only). Use this to enforce per-model OpenRouter routing guardrails —
      e.g. `compat.openRouterRouting` with `zdr: true`, `sort: "price"`, `quantizations`,
      and `ignore` lists — so the provider request carries your compliance filters instead
      of relying solely on account-level toggles. STRICT ALLOWLIST: only the shape
      `providers.<provider>.modelOverrides.<model>.compat.openRouterRouting` with safe
      scalar/array keys is accepted; dangerous keys (`baseUrl`, `endpoint`, `headers`,
      `apiKey`, `token`, …) are rejected loudly, because a models.json that redirects the
      provider endpoint could exfiltrate the API key used by the lens. Invalid/out-of-
      schema JSON fails the job. When unset/empty, no file is written and any stale file
      from a prior run is removed, so omitting the input is a true no-op. Must be
      workflow-author-controlled; never derive from untrusted PR/issue content.
    required: false
    default: ''
  thinking_level:
    description: "pi thinking level: low | medium | high."
    required: false
    default: 'medium'
  diff_max_lines:
    description: "Max diff lines fed to the reviewer."
    required: false
    default: '2000'
  diff_max_bytes:
    description: "Max diff bytes fed to the reviewer."
    required: false
    default: '204800'
  diff_ignore_patterns:
    description: "Space-separated globs to exclude from the diff (lockfiles, build output, vendored code)."
    required: false
    default: 'dist/ build/ node_modules/ pnpm-lock.yaml package-lock.json yarn.lock uv.lock poetry.lock go.sum Cargo.lock'
  loaded_tools:
    description: "Newline-separated allowlist of pi tools the lens agent may use. Default is READ-ONLY (fetch diff, fetch thread) — the agent does NOT post the review; the action posts it deterministically via Octokit. No shell, file-write, push, or PR-write tool, so a successful prompt injection can't exfiltrate the provider key or mutate the repo. When submit_findings_tool is true, `submit_findings` is appended to whatever you set here: it writes one file under runner.temp and reaches nothing else, so the read-only boundary is unchanged. Broaden at your own risk (OWASP LLM01)."
    required: false
    default: |
      get_pr_diff
      get_issue_or_pr_thread
  submit_findings_tool:
    description: "mode=lens: when true (default), the lens delivers its review by CALLING a `submit_findings` tool whose arguments are the findings schema, instead of ending its message in that shape. The provider validates a tool call's arguments before delivering it, so prose cannot arrive through that channel — which is the single largest source of failed lens jobs (a good review written as prose, or JSON with one bad escape, fails the gate closed on a formatting problem). The final-message contract remains valid and is still the documented fallback. Set to false to run message-only; the tool is then neither loaded nor named in the allowlist."
    required: false
    default: 'true'
  pr_number:
    description: "PR number to review. Defaults to the triggering pull_request."
    required: false
    default: ''
  cleanup_agent_comments:
    description: "mode=lens: when true (default), the lens deletes the raw JSON comment the pi agent action posts on the PR as a side effect of running. That comment is the agent's final message verbatim — the same findings this action re-posts as a rendered `## <Lens>` review — so it is a duplicate, it is unreadable, and nothing cleans it up: one accumulates per lens per push (8 lenses x 7 pushes = 56 on one PR). Deletion is safe because the content is losslessly reproduced in the review this step posts. Set to false to keep them."
    required: false
    default: 'true'

  dismiss_superseded:
    description: "mode=lens: when true (default), once the new review lands the lens dismisses its OWN prior reviews and collapses their inline comments as OUTDATED, so re-runs do not pile up stale noise. Includes prior reviews on the SAME commit: a lens that blocks on PR-body content is cleared by an edit, which changes no SHA, so the clearing run supersedes a review on the commit it is already on. The lens never dismisses the review it just posted, and only ever its own. Set to false to keep every historical review. Best-effort and cosmetic; needs pull-requests write (already required to post)."
    required: false
    default: 'true'
  required_checks:
    description: |
      mode=preflight: check-run names that must PASS before the review runs, ONE
      PER LINE. Check names routinely contain commas ("Build, lint and test"), so
      this is never comma-separated. Preflight waits for them and fails if any
      fails, so the paid lenses never run on a PR that fails the cheap
      deterministic gates. List only checks that run on every PR. Pass a block
      scalar:
        required_checks: |
          Build, lint and test
          gitleaks
    required: false
    default: ''
  preflight_timeout_seconds:
    description: "mode=preflight: max seconds to wait for required_checks to complete before failing."
    required: false
    default: '600'
  preflight_poll_seconds:
    description: "mode=preflight: seconds between polls while waiting for required_checks."
    required: false
    default: '30'
runs:
  using: 'composite'
  steps:
    # ── Config (mode=config): resolve the enabled lens set, and each lens's
    #    model, into the matrix the caller's review job fans out over.
    #
    #    This lives here rather than in the caller's workflow because the caller's
    #    config job used to be ~60 lines of inline Node that every consumer pasted
    #    a copy of — untestable, unfixable centrally, and carrying a hardcoded
    #    lens-key -> display-name table. lenses/manifest.json is the one list, and
    #    a lint check already forbids action.yml from growing a second copy; the
    #    example carried exactly the duplicate that check exists to prevent, just
    #    outside its reach. Logic is in scripts/lens-matrix.mjs (unit-tested in
    #    scripts/lens-matrix.test.mjs), same split as the models_config step. ──
    - name: Resolve the lens matrix
      id: lens_matrix
      if: inputs.mode == 'config'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ENABLED: ${{ inputs.enabled }}
        LENS_MODELS: ${{ inputs.lens_models }}
        DEFAULT_MODEL: ${{ inputs.default_model }}
      run: node "${{ github.action_path }}/scripts/lens-matrix.mjs"

    # ── Shared context: resolve the effective PR number and lens display names. ──
    #    Skipped for mode=config: that mode resolves the matrix from the registry
    #    alone and needs no PR, so requiring one would stop a caller resolving its
    #    lens set outside a pull_request event.
    - name: Resolve context and lens names
      id: ctx
      if: inputs.mode != 'config'
      shell: bash
      env:
        IN_MODE: ${{ inputs.mode }}
        IN_LENS: ${{ inputs.lens }}
        IN_LENSES: ${{ inputs.lenses }}
        IN_PR: ${{ inputs.pr_number }}
        EVENT_PR: ${{ github.event.pull_request.number }}
        IN_KEY: ${{ inputs.api_key }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "${{ github.action_path }}/scripts/resolve-context.cjs"

    # ── Consumer checkout (mode=lens): reviewers read surrounding code to confirm findings. ──
    - name: Checkout PR head
      if: inputs.mode == 'lens'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    # ── Compose the lens prompt: persona + shared output contract, PR number substituted. ──
    - name: Compose lens prompt
      if: inputs.mode == 'lens'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        LENS_KEY: ${{ inputs.lens }}
        PR: ${{ steps.ctx.outputs.pr_number }}
        REPO: ${{ github.repository }}
        IGNORED_PATHS: ${{ inputs.diff_ignore_patterns }}
        MAX_LINES: ${{ inputs.diff_max_lines }}
        MAX_BYTES: ${{ inputs.diff_max_bytes }}
        LOADED_TOOLS: ${{ inputs.loaded_tools }}
        SUBMIT_TOOL: ${{ inputs.submit_findings_tool }}
      run: node "${{ github.action_path }}/scripts/compose-prompt.cjs"

    # ── Write pi's models.json so per-model OpenRouter routing guardrails (ZDR,
    #    price-sort, precision, maker-ignore) are enforced on the provider request,
    #    not just at the account level. Validation + filesystem logic lives in
    #    scripts/models-config.mjs (unit-tested in scripts/models-config.test.mjs);
    #    this step just invokes it. Runs for every lens so an empty/omitted input
    #    also removes any stale file left on a non-ephemeral runner. The validator
    #    enforces a STRICT ALLOWLIST — only
    #    providers.<provider>.modelOverrides.<model>.compat.openRouterRouting with
    #    safe scalar/array keys — so a models_config that tries to override
    #    baseUrl/endpoint/headers/apiKey (a secret-exfiltration path) is rejected
    #    loudly, regardless of how a caller sourced the input. ──
    - name: Write pi models.json (provider routing guardrails)
      if: inputs.mode == 'lens'
      shell: bash
      env:
        MODELS_CONFIG: ${{ inputs.models_config }}
        # The routing overrides are keyed by model id, so the step needs to know
        # which model this lens actually runs to tell whether they apply at all.
        MODEL: ${{ inputs.model }}
      run: node "${{ github.action_path }}/scripts/models-config.mjs"

    - name: Run adversarial lens
      id: pi
      if: inputs.mode == 'lens'
      uses: shaftoe/pi-coding-agent-action@c1e0b11c0b667f8e8fe9d0df8810c0745bfff59e # v2.27.1
      with:
        github_token: ${{ inputs.github_token }}
        provider: ${{ inputs.provider }}
        model: ${{ inputs.model }}
        token: ${{ inputs.api_key }}
        thinking_level: ${{ inputs.thinking_level }}
        # The VALIDATED caps from the compose step, not the raw inputs: the
        # prompt states these numbers as fact, so the tool must be given the
        # same ones. See the compose step for the floor and why it exists.
        diff_max_lines: ${{ env.EFFECTIVE_MAX_LINES }}
        diff_max_bytes: ${{ env.EFFECTIVE_MAX_BYTES }}
        diff_ignore_patterns: ${{ inputs.diff_ignore_patterns }}
        loaded_tools: ${{ env.EFFECTIVE_LOADED_TOOLS }}
        extensions: ${{ inputs.submit_findings_tool == 'true' && format('{0}/extensions/submit-findings.ts', github.action_path) || '' }}
        export_session_html: true
        prompt: ${{ env.COMPOSED_PROMPT }}
      env:
        # Where submit_findings writes the review. Set from runner.temp by this
        # action and never from pull request content, so the tool has no
        # attacker-reachable write target. One file, one job, one runner.
        ADVERSARIAL_FINDINGS_PATH: ${{ runner.temp }}/adversarial-findings.json

    # ── Parse the agent's findings, render the `## <Lens>` review body, and POST
    #    it via Octokit. The agent never touches the GitHub write API.
    #
    #    Two channels, in order. The lens normally delivers its review by calling
    #    `submit_findings`, whose arguments the provider validated against the
    #    schema before the call was made — so that file cannot contain prose.
    #    Failing that, the review is read out of the agent's final message
    #    (steps.pi.outputs.response), which is the older contract and the one an
    #    unconstrained model can and does get wrong.
    #
    #    This step is deterministic: a flaky/empty model output fails THIS lens
    #    job loudly (attributably) so a human re-runs it. No automatic retry. ──
    - name: Parse findings + post review
      id: post
      if: always() && inputs.mode == 'lens'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        LENS_NAME: ${{ steps.ctx.outputs.lens_name }}
        LENS_HEADING: ${{ env.LENS_HEADING }}
        PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
        AGENT_RESPONSE: ${{ steps.pi.outputs.response }}
        AGENT_SUCCESS: ${{ steps.pi.outputs.success }}
        DISMISS_SUPERSEDED: ${{ inputs.dismiss_superseded }}
        CLEANUP_AGENT_COMMENTS: ${{ inputs.cleanup_agent_comments }}
        FINDINGS_PATH: ${{ runner.temp }}/adversarial-findings.json
      with:
        script: |
          const fs = require("fs");
          const lensName = process.env.LENS_NAME;
          const prNumber = Number(process.env.PR_NUMBER);
          const headSha = context.payload.pull_request.head.sha;
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          const SEVERITIES = new Set(["MUST FIX", "SHOULD FIX", "NITPICK"]);

          // ── 1. Read the review. ──
          // Preferred channel: the file submit_findings wrote. Its contents came
          // from a tool call whose arguments the PROVIDER checked against the
          // schema, so this path cannot carry prose, a stray fence, or a bad
          // escape — the three ways the message channel has failed in the field.
          // Absent or unreadable, fall through to the message and the tolerant
          // parser below; the tool is optional and can be switched off.
          const findingsPath = process.env.FINDINGS_PATH || "";
          let submitted = null;
          if (findingsPath) {
            try {
              if (fs.existsSync(findingsPath)) {
                submitted = JSON.parse(fs.readFileSync(findingsPath, "utf8"));
              }
            } catch (e) {
              // Never fatal: the message channel is still there to try.
              core.warning(`submit_findings wrote a file this step could not read (${e.message}); falling back to the agent's final message.`);
              submitted = null;
            }
          }
          if (submitted) core.info(`Read the review from submit_findings (${findingsPath}).`);

          // ── 1b. Otherwise, extract the JSON object from the agent's final message. ──
          // The instructions ask for JSON only, but be tolerant: models often emit
          // a short prose preamble ("I'll fetch the diff.") before the JSON, or
          // wrap it in ```json fences. Strategy: strip fences, then walk brace
          // depth from the FIRST `{` to its MATCHING `}` (a lastIndexOf approach
          // breaks on nested objects like findings:[{...}], pointing at an inner
          // brace). Try the whole message first as the fast path.
          const raw = process.env.AGENT_RESPONSE || "";
          const fail = (m) => { core.setFailed(`Lens "${lensName}" — ${m}`); return null; };
          let parsed = submitted && typeof submitted === "object" ? submitted : null;
          // An empty final message is normal once the tool channel is in use:
          // the lens has said everything it has to say by calling the tool, and
          // some models reply with nothing afterwards. Only treat it as "the
          // agent produced no output" when there is no submitted review either.
          if (!parsed && !raw.trim()) {
            return fail(`agent produced no output (steps.pi.outputs.response empty; agent_success=${process.env.AGENT_SUCCESS}). Re-run this job to retry.`);
          }
          // Strip ```json / ``` fences so a fenced block parses as the whole.
          const fenceStripped = parsed ? "" : raw.replace(/```(?:json)?/gi, "").trim();
          if (!parsed) { try { parsed = JSON.parse(fenceStripped); } catch (_) {} }
          if (!parsed) {
            // Walk from the first `{` to its matching `}`, skipping braces inside
            // string literals (so `{` inside a JSON string value doesn't fool us).
            const start = fenceStripped.indexOf("{");
            if (start !== -1) {
              let depth = 0, inStr = false, esc = false, end = -1;
              for (let i = start; i < fenceStripped.length; i++) {
                const c = fenceStripped[i];
                if (inStr) {
                  if (esc) esc = false;
                  else if (c === "\\") esc = true;
                  else if (c === '"') inStr = false;
                } else if (c === '"') inStr = true;
                else if (c === "{") depth++;
                else if (c === "}") { depth--; if (depth === 0) { end = i; break; } }
              }
              if (end > start) {
                try { parsed = JSON.parse(fenceStripped.slice(start, end + 1)); } catch (e) {
                  return fail(`agent response was not valid JSON (${e.message}). Re-run this job to retry.`);
                }
              }
            }
          }
          if (!parsed || typeof parsed !== "object") {
            return fail("agent response had no parseable JSON object. Re-run this job to retry.");
          }

          // ── 2. Validate the schema. ──
          // Lens name: accept case-insensitive match OR one containing the other,
          // so a persona that calls itself "Policy & Provenance" validates against
          // a lens keyed "policy" (display "Compliance"). Exact match is the
          // common case; the fuzzy check is defensive against persona naming drift.
          const emittedLens = String(parsed.lens || "").trim();
          const norm = (s) => s.toLowerCase();
          // Accept documented persona subtitles as explicit aliases: some models emit
          // the subtitle despite being instructed to emit the primary name. This is
          // what killed every Security Review job when its heading still read
          // "Sentinel — Security Auditor Agent" and models answered "Security Auditor".
          const aliases = {
            "cold read — zero-context adversarial agent": "cold read",
            "edge cases — exhaustive path analysis agent": "edge cases",
            "acceptance criteria — spec conformance agent": "acceptance criteria",
            "security review — exploitable vulnerability agent": "security review",
            "red team — offensive attack-chain agent": "red team",
            "policy & provenance — contribution governance agent": "policy & provenance",
            "zero-context adversarial agent": "cold read",
            "exhaustive path analysis agent": "edge cases",
            "spec conformance agent": "acceptance criteria",
            "exploitable vulnerability agent": "security review",
            "offensive attack-chain agent": "red team",
            "contribution governance agent": "policy & provenance",
            "owasp web top 10 — application security lens": "owasp web top 10",
            "owasp genai/llm top 10 — ai application security lens": "owasp llm top 10",
          };
          const expectedNorm = norm(lensName);
          // Tolerant match (the explicit `aliases` map above only catches subtitles
          // seen verbatim before — e.g. Gemini emits "Security Review — Security Review
          // Agent", which no map entry covers). Accept when the emitted name's
          // primary segment (before any —/–/-/:/| subtitle) equals the expected
          // name, or when either name contains the other. The lens keys are
          // distinct enough (cold_read/edge_case/acceptance/security/red_team/policy/
          // owasp-*) that containment cannot cross-match one persona to another.
          //
          // Named, because step 8 below reuses it to identify THIS lens's stray
          // agent comment. Two copies of this rule would drift, and a drifted
          // copy would delete another lens's comment.
          const primary = (s) => s.split(/\s*[—–:|]\s*|\s+-\s+/)[0].trim();
          // The persona's own H1, from the compose step. Its segments are the
          // names a model actually emits, so they are accepted EXACTLY — never by
          // containment. Containment across subtitles would cross-match: the
          // OWASP Web subtitle "Application Security Lens" is a substring of the
          // OWASP LLM subtitle "AI Application Security Lens", so a containment
          // rule would let one lens claim the other's output.
          const heading = String(process.env.LENS_HEADING || "").trim();
          const headingNames = new Set();
          if (heading) {
            headingNames.add(norm(heading));
            headingNames.add(norm(primary(heading)));
            const parts = heading.split(/\s*[—–:|]\s*|\s+-\s+/).map((x) => x.trim()).filter(Boolean);
            if (parts.length > 1) headingNames.add(norm(parts.slice(1).join(" ")));
          }
          const matchesThisLens = (name) => {
            const raw = norm(String(name || "").trim());
            if (!raw) return false;
            const n = Object.prototype.hasOwnProperty.call(aliases, raw) ? aliases[raw] : raw;
            return (
              n === expectedNorm ||
              primary(n) === expectedNorm ||
              headingNames.has(n) ||
              n.includes(expectedNorm) ||
              expectedNorm.includes(n)
            );
          };
          if (!matchesThisLens(emittedLens)) {
            return fail(`agent emitted lens="${emittedLens}" but this job is "${lensName}". Re-run this job to retry.`);
          }
          const summary = typeof parsed.summary === "string" ? parsed.summary.trim() : "";
          let findings = Array.isArray(parsed.findings) ? parsed.findings : null;
          if (findings === null) return fail(`JSON missing or non-array \`findings\` (use [] for none). Re-run this job to retry.`);
          for (const f of findings) {
            if (typeof f !== "object" || !f) return fail("a finding is not an object. Re-run this job to retry.");
            if (!SEVERITIES.has(f.severity)) return fail(`finding severity "${f.severity}" not in {MUST FIX, SHOULD FIX, NITPICK}. Re-run this job to retry.`);
            if (typeof f.location !== "string" || !f.location.trim()) return fail("a finding has no \`location\` (file:line). Re-run this job to retry.");
            if (typeof f.detail !== "string" || !f.detail.trim()) return fail("a finding has no \`detail\`. Re-run this job to retry.");
            if (typeof f.recommendation !== "string" || !f.recommendation.trim()) return fail("a finding has no \`recommendation\`. Re-run this job to retry.");
          }
          core.info(`Parsed ${findings.length} finding(s) for "${lensName}".`);

          // ── 3. Render the review body: `## <Lens Name>` + summary + bullets. ──
          const lines = [`## ${lensName}`, ""];
          if (summary) lines.push(`> ${summary}`, "");
          if (findings.length === 0) {
            lines.push("No findings.");
          } else {
            for (const f of findings) {
              lines.push(`- [${f.severity}] \`${f.location}\` — ${f.detail}`);
              lines.push(`  - Fix: ${f.recommendation}`);
            }
          }
          const body = lines.join("\n");
          const event = findings.some((f) => f.severity === "MUST FIX") ? "REQUEST_CHANGES" : "COMMENT";

          // ── 4. Build the inline-comment anchor. The GitHub review API requires
          //    a non-empty comments array. Anchor one comment on the first changed
          //    file/line of the diff (deterministic — we compute it, not the
          //    model), plus per-finding comments whose location maps to a real
          //    diff line. Every path MUST come from the actual PR files; an
          //    invented path would 422 the whole review. ──
          const files = await github.paginate(github.rest.pulls.listFiles, {
            owner, repo, pull_number: prNumber, per_page: 100,
          });
          // Map of path -> Set of changed line numbers (from unified-diff hunks).
          // Only count real added lines (`+`, not the `+++ ` file header) so the
          // anchor line is always a valid new-file line number >= 1.
          const changedLinesByPath = new Map();
          for (const f of files) {
            const set = new Set();
            let line = 0;
            for (const h of (f.patch || "").split("\n")) {
              const m = h.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
              if (m) { line = Number(m[1]); continue; }
              if (h.startsWith("+++") || h.startsWith("---")) continue; // file headers
              if (h.startsWith("+")) { set.add(line); line++; continue; }
              if (h.startsWith("-") || h.startsWith("\\")) continue;
              if (h.startsWith(" ")) line++;
            }
            if (set.size) changedLinesByPath.set(f.filename, set);
          }
          const parseLoc = (loc) => {
            const m = String(loc).match(/^(.+):(\d+)$/);
            return m ? { path: m[1], line: Number(m[2]) } : null;
          };
          const comments = [];
          const used = new Set();
          for (const f of findings) {
            const loc = parseLoc(f.location);
            if (!loc) continue;
            const set = changedLinesByPath.get(loc.path);
            if (!set || !set.has(loc.line)) continue; // not a real diff line — skip
            const key = `${loc.path}:${loc.line}`;
            if (used.has(key)) continue;
            used.add(key);
            comments.push({ path: loc.path, line: loc.line, body: `[${f.severity}] ${f.detail}\n\nFix: ${f.recommendation}` });
          }
          // Fallback anchor: first changed file's first changed line, body="See the review summary."
          if (!comments.length) {
            for (const [path, lines2] of changedLinesByPath) {
              const firstLine = Math.min(...lines2);
              comments.push({ path, line: firstLine, body: "See the review summary." });
              break;
            }
          }
          if (!comments.length) {
            return fail("PR has no changed files to anchor an inline comment on (empty diff?). Cannot post review.");
          }

          // ── 5. Post the review via Octokit (deterministic). ──
          core.info(`Posting review: event=${event}, ${comments.length} inline comment(s), body ${body.length} chars.`);
          let review;
          try {
            review = await github.rest.pulls.createReview({
              owner, repo, pull_number: prNumber,
              commit_id: headSha, body, event, comments,
            });
          } catch (e) {
            return fail(`createReview failed: ${e.message}`);
          }
          core.info(`Posted review id=${review.data.id} on ${headSha.slice(0, 12)}.`);

          // ── 6. Verify it landed on the head SHA (same contract as before). ──
          const reviews = await github.paginate(github.rest.pulls.listReviews, {
            owner, repo, pull_number: prNumber, per_page: 100,
          });
          const isBot = (r) => r.user && (r.user.login === "github-actions[bot]" || r.user.login === "github-actions");
          const header = `## ${lensName}`;
          // Exact first-line match, NOT a prefix: a bare startsWith would let a
          // lens whose name is a textual prefix of another (e.g. "Security Review" vs
          // "Security Review Plus") claim — and dismiss/collapse — the other lens's
          // reviews and comments. Reachable through ordinary lens-name config,
          // no attacker required.
          const ownsReview = (r) => (r.body || "").split("\n")[0].trim() === header;
          const ok = reviews.some(
            (r) => r.commit_id === headSha && isBot(r) && ownsReview(r),
          );
          core.info(`"${header}" review on ${headSha.slice(0, 12)}: ${ok}`);
          if (!ok) {
            core.setFailed(`Lens "${lensName}" posted a review but it did not land on the head SHA. Re-run this job to retry.`);
          }

          // ── 7. Reconcile: once the new review has landed, dismiss THIS lens's
          //    superseded reviews and collapse their inline comments as OUTDATED,
          //    so re-runs don't pile up stale noise. Best-effort and cosmetic — a
          //    failure here never fails the lens, and the gate already scopes
          //    adjudication to the head SHA.
          //    Superseding is NOT limited to earlier commits. A lens that blocks on
          //    PR-body content (Policy & Provenance: provenance disclosure, the
          //    accountability attestation) is cleared by editing the body, which
          //    changes no SHA — so the clearing re-run lands on the same commit as
          //    the review it supersedes. Skipping those left the old
          //    CHANGES_REQUESTED live, and GitHub's aggregate reviewDecision kept
          //    the PR BLOCKED behind a green Merge Gate. `r.id !== review.data.id`
          //    below is what keeps this safe: a lens never dismisses the review it
          //    just posted.
          //    Each lens only touches its OWN `## <Lens>` reviews (header match),
          //    so lenses running in parallel never collide. ──
          // Parse the opt-out explicitly and fail CLOSED: this collapses comments
          // and dismisses reviews, so only a clearly-truthy value enables it. A
          // non-canonical string (e.g. "0", "no", a typo) disables + warns rather
          // than silently enabling a destructive-ish operation.
          const rawDismiss = String(process.env.DISMISS_SUPERSEDED ?? "true").trim().toLowerCase();
          const TRUTHY = new Set(["true", "1", "yes", "on"]);
          const FALSY = new Set(["false", "0", "no", "off", ""]);
          const dismissOn = TRUTHY.has(rawDismiss);
          if (!TRUTHY.has(rawDismiss) && !FALSY.has(rawDismiss)) {
            core.warning(`Unrecognized dismiss_superseded value "${process.env.DISMISS_SUPERSEDED}" — treating as disabled (expected true/false).`);
          }
          if (ok && dismissOn) {
            try {
              const superseded = reviews.filter(
                (r) =>
                  isBot(r) &&
                  ownsReview(r) &&
                  r.commit_id &&
                  r.state !== "DISMISSED" &&
                  r.id !== review.data.id,
              );
              let dismissed = 0, minimized = 0, warnedMinimize = false;
              // Bound total minimize calls per job: pagination + per-comment
              // GraphQL run serially, and every parallel lens sweeps the same PR,
              // so an old PR with many prior comments could hit GitHub's secondary
              // rate limit or the step timeout. Leftovers are retried next run.
              let minimizeBudget = 200;
              if (superseded.length) {
                const supIds = new Set(superseded.map((r) => r.id));
                const allComments = await github.paginate(github.rest.pulls.listReviewComments, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                });
                const byReview = new Map();
                for (const c of allComments) {
                  if (!supIds.has(c.pull_request_review_id)) continue;
                  (byReview.get(c.pull_request_review_id) || byReview.set(c.pull_request_review_id, []).get(c.pull_request_review_id)).push(c);
                }
                supersededLoop:
                for (const r of superseded) {
                  // Collapse this review's inline comments FIRST, and dismiss it only
                  // if EVERY comment collapsed. Dismissing first is non-atomic: if a
                  // later minimize fails, the review is already DISMISSED and the
                  // `superseded` filter excludes it forever, stranding its remaining
                  // comments with no retry path. Minimize-first + dismiss-only-if-all
                  // makes a partial failure self-heal — the review stays
                  // CHANGES_REQUESTED and is retried on the next run.
                  let allCollapsed = true;
                  for (const c of (byReview.get(r.id) || [])) {
                    if (minimizeBudget <= 0) {
                      allCollapsed = false;
                      core.warning(`Hit the minimize cap (200) reconciling "${lensName}" — leaving the rest for the next run.`);
                      break supersededLoop;
                    }
                    try {
                      await github.graphql(
                        "mutation($id: ID!) { minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) { minimizedComment { isMinimized } } }",
                        { id: c.node_id },
                      );
                      minimized++;
                      minimizeBudget--;
                    } catch (e) {
                      allCollapsed = false; // rate limit / perms — leave un-dismissed so next run retries
                      if (!warnedMinimize) {
                        core.warning(`minimizeComment failed for a superseded "${lensName}" comment (left un-dismissed for retry): ${e.message}`);
                        warnedMinimize = true;
                      }
                    }
                  }
                  // dismissReview applies only to CHANGES_REQUESTED / APPROVED; a
                  // COMMENTED review can't be dismissed (its comments are collapsed above).
                  if (allCollapsed && (r.state === "CHANGES_REQUESTED" || r.state === "APPROVED")) {
                    try {
                      await github.rest.pulls.dismissReview({
                        owner, repo, pull_number: prNumber, review_id: r.id,
                        message: `Superseded by the ${lensName} review on ${headSha.slice(0, 7)}.`,
                      });
                      dismissed++;
                    } catch (e) {
                      core.info(`  could not dismiss review ${r.id}: ${e.message}`);
                    }
                  }
                }
                core.info(`Reconciled ${superseded.length} superseded "${lensName}" review(s): collapsed ${minimized} comment(s), dismissed ${dismissed}.`);
              }
            } catch (e) {
              core.warning(`Reconcile step failed (non-fatal): ${e.message}`);
            }
          }

          // ── 8. Delete the agent action's own raw-JSON PR comment. ──
          //    The pi action posts the agent's final message as a top-level PR
          //    comment whenever it has PR context; it has no input to disable
          //    that (checked through v2.27.1). So every lens run leaves a
          //    ```json block on the PR that duplicates the review this step just
          //    rendered, and nothing ever collapses it — `dismiss_superseded`
          //    only reaches reviews and their INLINE comments. They accumulate
          //    per lens per push and drown the actual review.
          //
          //    Deleting is lossless: the same findings are in the `## <Lens>`
          //    review body above. Matching is deliberately narrow — bot-authored,
          //    parses as a JSON object, has a `findings` array, and its `lens`
          //    resolves to THIS lens by the same check used above — so a human
          //    comment, or another lens's comment, is never touched.
          //    Best-effort: a failure here never fails the lens.
          const rawCleanup = String(process.env.CLEANUP_AGENT_COMMENTS ?? "true").trim().toLowerCase();
          if (new Set(["true", "1", "yes", "on"]).has(rawCleanup)) {
            try {
              const issueComments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              let deleted = 0;
              let budget = 100; // bound the API calls per job, like the minimize sweep
              for (const c of issueComments) {
                if (budget <= 0) { core.warning(`Hit the agent-comment cleanup cap (100) for "${lensName}" — leaving the rest for the next run.`); break; }
                if (!isBot(c)) continue;
                const body = String(c.body || "");
                // Cheap reject before parsing: the agent's message is JSON, and
                // an ordinary human or bot comment is not.
                if (!/^\s*(```(?:json)?)?\s*\{/.test(body)) continue;
                let obj = null;
                try { obj = JSON.parse(body.replace(/```(?:json)?/gi, "").trim()); } catch (_) { continue; }
                if (!obj || typeof obj !== "object" || !Array.isArray(obj.findings)) continue;
                const claimed = String(obj.lens || "").trim();
                if (!claimed || !matchesThisLens(claimed)) continue;
                budget--;
                try {
                  await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
                  deleted++;
                } catch (e) {
                  core.info(`  could not delete agent comment ${c.id}: ${e.message}`);
                }
              }
              if (deleted) core.info(`Removed ${deleted} duplicate raw-JSON agent comment(s) for "${lensName}".`);
            } catch (e) {
              core.warning(`Agent-comment cleanup failed (non-fatal): ${e.message}`);
            }
          }

    - name: Upload review session
      if: always() && inputs.mode == 'lens' && steps.pi.outputs.session_html_path
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pi-review-session-${{ inputs.lens }}
        path: ${{ steps.pi.outputs.session_html_path }}
        retention-days: 30

    # ── Merge gate (mode=gate): adjudicate the lenses on the head commit, fail closed. ──
    - name: Aggregate lens results
      if: inputs.mode == 'gate'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        EXPECTED: ${{ steps.ctx.outputs.expected }}
        PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
      with:
        script: |
          const { run } = require("${{ github.action_path }}/scripts/gate.cjs");
          await run({ core, github, context, env: process.env });

    # ── Preflight (mode=preflight): wait for the cheap deterministic checks to
    #    PASS before the paid lenses run. No model call. ──
    - name: Wait for prerequisite checks
      if: inputs.mode == 'preflight'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REQUIRED_CHECKS: ${{ inputs.required_checks }}
        TIMEOUT_S: ${{ inputs.preflight_timeout_seconds }}
        POLL_S: ${{ inputs.preflight_poll_seconds }}
      with:
        script: |
          const { run } = require("${{ github.action_path }}/scripts/preflight.cjs");
          await run({ core, github, context, env: process.env });
