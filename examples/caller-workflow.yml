# Blind Peer Review — consumer workflow.
#
# Copy this to `.github/workflows/blind-peer-review.yml`. Add repo secret
# OPENROUTER_API_KEY, then require the "Merge Gate" check in branch protection.
#
# TOGGLE STEPS in the `ENABLED` list in the `config` job below: comment a line to
# disable a lens, uncomment one to enable it. That single list drives BOTH the
# parallel review matrix AND the gate — one source of truth.
#
# Pin the action to a released tag (or a commit SHA for OpenSSF Scorecard).

name: Blind Peer Review

on:
  pull_request:
    # `edited` matters when the `policy` lens is enabled: it blocks on PR-BODY
    # content (AI-provenance disclosure, the human-accountability attestation),
    # and the fix for those findings is editing the description — which changes no
    # SHA and fires no other trigger. Without `edited`, the one action that clears
    # the finding cannot re-run the check. The concurrency group above keeps the
    # cost bounded: a burst of edits cancels its own superseded runs.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

concurrency:
  group: blind-peer-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: read        # the Compliance lens reads the PR thread (get_issue_or_pr_thread)

jobs:
  # ── Config: the ONE place to toggle lenses. Emits the enabled set as a matrix
  #    that drives BOTH the parallel review jobs AND the gate, so the two cannot
  #    disagree about which lenses were expected. ──
  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        uses: jamescrowley321/blind-peer-review@v3
        with:
          mode: config
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # TOGGLE LENSES HERE — one per line, `#` to disable. Display names come
          # from the action's lenses/manifest.json, so this list never drifts from
          # the registry. An unknown or repeated key fails the job.
          enabled: |
            cold_read      # logic bugs, footguns (zero context)
            edge_case      # unhandled branches / boundaries
            acceptance     # PR acceptance criteria met + tested
            security       # exploitable security vulnerabilities
            red_team       # attack paths (auth/infra only)
            policy         # AI-provenance policy + your own rules
            # owasp_web    # OWASP Web Top 10 (2021) — optional
            # owasp_llm    # OWASP GenAI/LLM Top 10 (2026) — for LLM apps
          # OPTIONAL per-lens models. The lenses are not the same kind of work:
          # Policy & Provenance checks whether a checkbox is ticked; Cold Read and
          # Red Team hunt defects nobody has found yet. Anything unlisted falls back
          # to default_model. Delete both inputs to run one model everywhere.
          #
          # Score models on YOUR fixtures before trusting a tier — the split below
          # is a cost illustration, not a quality claim. See docs/model-selection.md.
          lens_models: |
            cold_read = anthropic/claude-sonnet-5
            red_team  = anthropic/claude-sonnet-5
            security  = anthropic/claude-sonnet-5
          default_model: google/gemini-3.8-flash

  # Deterministic gate: the paid lenses (review) `needs:` this, so they never run
  # unless the cheap checks pass first. The fork/bot gate lives here and cascades.
  # Don't spend on fork PRs (they get no secret anyway) or Dependabot. Outside
  # contributors are gated by the repo setting "Require approval for all outside
  # collaborators" — NOT by author_association (the event reports CONTRIBUTOR for
  # org members, which would wrongly skip their PRs).
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      github.actor != 'dependabot[bot]'
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Wait for deterministic checks
        uses: jamescrowley321/blind-peer-review@v3
        with:
          mode: preflight
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # EXACT check-run names that must pass before the lenses run — edit per
          # repo, ONE PER LINE. Not comma-separated: check names routinely contain
          # commas ("Build, lint and test"), and splitting on one turns a single
          # real check into fragments that never report, so preflight waits out its
          # entire timeout for checks that do not exist.
          required_checks: |
            lint
            typecheck
            build
            secret-scan

  review:
    name: ${{ matrix.name }}
    needs: [config, preflight]
    runs-on: ubuntu-latest
    # Lenses run in PARALLEL (one job per lens). The agent never posts the review
    # itself — it emits findings as JSON and the action posts via Octokit
    # deterministically — so concurrent-load tool-call flakes are no longer a risk.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - name: ${{ matrix.name }}
        uses: jamescrowley321/blind-peer-review@v3
        with:
          mode: lens
          lens: ${{ matrix.lens }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          api_key: ${{ secrets.OPENROUTER_API_KEY }}
          model: ${{ matrix.model }}
          # Enforce the ZDR floor on the request so it routes to a Zero-Data-Retention
          # endpoint (e.g. Vertex). JSON for pi's ~/.pi/agent/models.json; omit to fall
          # back to account settings.
          #
          # These overrides are keyed BY MODEL ID. They apply to nothing for a model
          # that has no entry — silently: the JSON stays valid, the lens still runs,
          # and the zdr/data_collection floor simply is not in force. So EVERY slug
          # the matrix can emit needs an entry here, including DEFAULT_MODEL. The
          # action warns when the model it runs is not covered; the config job prints
          # the distinct slugs to cross-check against this block.
          models_config: |
            {
              "providers": {
                "openrouter": {
                  "modelOverrides": {
                    "google/gemini-3.8-flash": {
                      "compat": { "openRouterRouting": { "zdr": true, "data_collection": "deny" } }
                    },
                    "anthropic/claude-sonnet-5": {
                      "compat": { "openRouterRouting": { "zdr": true, "data_collection": "deny" } }
                    }
                  }
                }
              }
            }

  gate:
    name: Merge Gate
    needs: [config, preflight, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Record exempt PR
        if: github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'
        run: echo "Blind peer review is intentionally exempt for fork and Dependabot PRs."
      - name: Fail closed when prerequisites did not succeed
        if: >-
          github.event.pull_request.head.repo.fork == false &&
          github.actor != 'dependabot[bot]' &&
          (needs.config.result != 'success' || needs.preflight.result != 'success' || needs.review.result != 'success')
        env:
          CONFIG_RESULT: ${{ needs.config.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          echo "::error::Blind peer review prerequisites did not succeed (config=$CONFIG_RESULT, preflight=$PREFLIGHT_RESULT, review=$REVIEW_RESULT)."
          exit 1
      - name: Adjudicate lenses
        if: >-
          github.event.pull_request.head.repo.fork == false &&
          github.actor != 'dependabot[bot]' &&
          needs.config.result == 'success' && needs.preflight.result == 'success' && needs.review.result == 'success'
        uses: jamescrowley321/blind-peer-review@v3
        with:
          mode: gate
          # The same value that built the matrix — the gate's expected set and the
          # jobs that ran are then one thing, not two kept in sync by hand.
          lenses: ${{ needs.config.outputs.matrix }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
